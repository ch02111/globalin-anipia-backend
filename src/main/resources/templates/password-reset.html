<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>パスワードの再設定</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
<div style="max-width: 600px; padding: 20px;">
  <h2>パスワードの再設定</h2>
  <p>いつもANIPIAをご利用いただき、ありがとうございます。</p>
  <br>
  <p>
    お客様のアカウントに対し、パスワード再設定のリクエストがありました。<br>
    以下のボタンをクリックして、新しいパスワードを設定してください。
  </p>
  <p style="margin: 30px 0;">
    <a th:href="${link}"
       style="display: inline-block; padding: 12px 24px; background-color: #007bff; color: #ffffff; text-decoration: none; border-radius: 4px;">
      パスワードを再設定する
    </a>
  </p>

  <p style="margin-top: 30px; color: #666; font-size: 14px;">
    ※ このリンクの有効期限は5分間です。<br>
    ※ 本メールにお心当たりがない場合は、他の方が誤って入力した可能性があります。<br>
    その場合、本メールを破棄していただければパスワードは変更されません。
  </p>
</div>
</body>
</html>

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.8'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.afivestudio'
version = '0.0.1-SNAPSHOT'
description = 'globalin team project for Spring Boot'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {

    // AWS S3 (이미지 업로드 필수)
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-s3:3.1.0'

    // Actuator (ALB 헬스체크 필수)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // mail
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    // thymeleaf (메일 보내기 용)
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    // redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // jwt
    implementation 'com.auth0:java-jwt:4.5.0'

    // Spring Boot 3.x용 (WebMVC)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.15'
    // springdoc 등 다른 라이브러리가 3.17.0을 가져오더라도, 무조건 3.18.0을 쓰도록 강제 추가
    implementation 'org.apache.commons:commons-lang3:3.18.0'

    // data
    implementation 'org.springframework.data:spring-data-commons'

    // web
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // mail sender
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // security
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // validator
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // mybatis
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.5'

    // lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // mariadb driver
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:3.0.5'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
